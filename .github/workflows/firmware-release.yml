name: Create Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'firmware/**'
      - 'proxy.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tous les tags

      - name: Calculer la version automatique
        id: version
        run: |
          # main → release stable AAAA.MM.XX
          # dev  → prerelease béta AAAA.MM.XX-beta.N (vers la prochaine stable)
          YEAR_MONTH=$(date -u +"%Y.%m")
          PREFIX="v${YEAR_MONTH}"

          # Dernier numéro de révision STABLE du mois (exclut les -beta)
          LAST_STABLE=$(git tag -l "${PREFIX}.*" --sort=-v:refname | grep -v -- '-beta' | head -n1)
          if [ -z "$LAST_STABLE" ]; then
            LAST_STABLE_NUM=0
          else
            LAST_STABLE_NUM=$(echo "$LAST_STABLE" | sed "s/${PREFIX}\.//")
          fi
          NEXT_NUM=$(printf "%02d" $((10#$LAST_STABLE_NUM + 1)))

          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION="${YEAR_MONTH}.${NEXT_NUM}"
            PRERELEASE="false"
          else
            # Béta vers la prochaine révision stable : AAAA.MM.NEXT-beta.N
            TARGET="${YEAR_MONTH}.${NEXT_NUM}"
            LAST_BETA_NUM=$(git tag -l "v${TARGET}-beta.*" | sed "s/.*-beta\.//" | sort -n | tail -n1)
            BETA_NUM=$(( ${LAST_BETA_NUM:-0} + 1 ))
            VERSION="${TARGET}-beta.${BETA_NUM}"
            PRERELEASE="true"
          fi
          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag: $TAG, prerelease: $PRERELEASE)"

      - name: Creer le tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            Version `${{ steps.version.outputs.version }}`${{ steps.version.outputs.prerelease == 'true' && ' (béta — branche dev)' || ' (stable — branche main)' }}

            Le firmware est compile automatiquement par le serveur de production avec le `config.h` local.
            Le build demarre en arriere-plan des la detection de cette release.
            Mettre a jour depuis le dashboard web → Debug → Mise a jour firmware.
            ${{ steps.version.outputs.prerelease == 'true' && 'Béta : visible dans le sélecteur de version, pas proposée en mise à jour automatique.' || '' }}
